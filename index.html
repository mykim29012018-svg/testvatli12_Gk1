<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trắc nghiệm Vật lí 12 – Chương 1: Vật lí nhiệt</title>
<style>
:root{--bg:#f6f7f9;--fg:#1d2330;--mut:#667085;--card:#fff;--bd:#d9dee7;--acc:#2456c8;--accbg:#e8effd;--ok:#157a3d;--okbg:#e3f5e9;--bad:#b42318;--badbg:#fdeae8;--hl:#fff6dd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--fg:#e8ebf1;--mut:#9aa4b5;--card:#1b212b;--bd:#323b4a;--acc:#7aa2ff;--accbg:#1f2c4a;--ok:#5ad08a;--okbg:#14301f;--bad:#ff8a80;--badbg:#3a1a18;--hl:#3a331a}}
:root[data-theme="dark"]{--bg:#12161d;--fg:#e8ebf1;--mut:#9aa4b5;--card:#1b212b;--bd:#323b4a;--acc:#7aa2ff;--accbg:#1f2c4a;--ok:#5ad08a;--okbg:#14301f;--bad:#ff8a80;--badbg:#3a1a18;--hl:#3a331a}
html,body{height:auto}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:760px;margin:0 auto;padding:14px 14px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
h1{font-size:1.35rem;margin:.2em 0 .4em}
.mut{color:var(--mut);font-size:.9rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--acc)}
.stem{margin:0 0 12px;font-size:1.04rem}
.fig{background:#fff;border-radius:10px;border:1px solid var(--bd);padding:6px;margin:0 0 12px;text-align:center}.fig img{max-width:100%;height:auto}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--fg);border:1.5px solid var(--bd);border-radius:10px;padding:10px 12px;margin:0 0 8px;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--acc)}.opt.sel{border-color:var(--acc);background:var(--accbg)}
.opt b{flex:0 0 1.5em}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt[disabled]{cursor:default}
.row{padding:10px 0;border-top:1px solid var(--bd)}.row:first-of-type{border-top:0}
.yn{display:flex;gap:8px;margin-top:8px}.yn button{flex:1;padding:8px;border-radius:8px;border:1.5px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
.yn button.sel{border-color:var(--acc);background:var(--accbg);font-weight:600}.yn button.ok{border-color:var(--ok);background:var(--okbg);font-weight:600}.yn button.bad{border-color:var(--bad);background:var(--badbg)}
input.num{width:100%;font:inherit;font-size:1.1rem;padding:10px 12px;border-radius:10px;border:1.5px solid var(--bd);background:var(--card);color:var(--fg)}
.exp{margin-top:10px;padding:10px 12px;background:var(--hl);border-radius:10px;font-size:.95rem}
.tag{display:inline-block;font-size:.8rem;font-weight:600;padding:2px 8px;border-radius:99px;margin-left:6px}.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}
.nav{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{font:inherit;padding:10px 16px;border-radius:10px;border:1.5px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}:root[data-theme="dark"] .btn.p{color:#0b1020}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.p{color:#0b1020}}
.btn[disabled]{opacity:.4;cursor:default}.sp{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.chips button{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;font-size:.85rem;cursor:pointer;padding:0}
.chips .ans{background:var(--accbg);border-color:var(--acc)}.chips .ok{background:var(--okbg);border-color:var(--ok)}.chips .bad{background:var(--badbg);border-color:var(--bad)}.chips .part{background:var(--hl);border-color:#d9a400}.chips .cur{outline:2.5px solid var(--fg);outline-offset:1px}
.score{font-size:2.6rem;font-weight:700;margin:.1em 0}
table.t{border-collapse:collapse;margin:0 0 12px;width:100%}table.t td,table.t th{border:1px solid var(--bd);padding:6px 8px;text-align:center}table.t th{background:var(--accbg)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
</style></head><body><div id="app"></div>

g (giãn vào chân không) nên nội năng không đổi.", "Nhiệt độ khí tăng, vì các phân tử va chạm với thành bình nhiều hơn.", "Nhiệt độ khí không đổi, vì khí nhận nhiệt từ vách ngăn đúng bằng lượng công khí đã sinh ra."], "correct": 1, "exp": "Bình cách nhiệt: Q = 0; giãn vào chân không không có lực cản nên A = 0; ΔU = 0, khí lí tưởng có U chỉ phụ thuộc nhiệt độ nên nhiệt độ không đổi."}, {"type": "mc", "part": 1, "stem": "Một lượng khí thực hiện một chu trình kín (sau chu trình khí trở về đúng trạng thái ban đầu). Trong cả chu trình, khí nhận tổng cộng 500 J nhiệt lượng và tỏa ra tổng cộng 350 J nhiệt lượng. Phát biểu nào sau đây đúng?", "img": null, "opts": ["Nội năng của khí tăng 150 J và khí không sinh công.", "Nội năng của khí không đổi, khí nhận công ròng 150 J từ bên ngoài.", "Nội năng của khí không đổi, khí sinh công ròng 150 J.", "Nội năng của khí không đổi, khí sinh công ròng 850 J."], "correct": 2, "exp": "Trở về trạng thái đầu nên ΔU = 0; Q ròng = 500 − 350 = +150 J nên ΔU = A + Q cho A = −150 J, tức khí sinh công ròng 150 J."}, {"type": "mc", "part": 1, "stem": "Nhiệt độ của một vật tăng từ 27 °C lên 54 °C. Nhận định nào sau đây đúng?", "img": null, "opts": ["Nhiệt độ tuyệt đối của vật tăng gấp đôi vì số đo theo thang Celsius tăng gấp đôi.", "Nhiệt độ của vật tăng thêm 300 K vì phải đổi cả hai nhiệt độ sang thang Kelvin trước khi so sánh.", "Độ tăng nhiệt độ theo thang Kelvin lớn hơn 27 K vì mỗi độ chia Kelvin nhỏ hơn mỗi độ chia Celsius.", "Nhiệt độ của vật tăng thêm 27 K, nhưng nhiệt độ tuyệt đối không tăng gấp đôi (tăng từ 300 K lên 327 K)."], "correct": 3, "exp": "Độ chia hai thang như nhau nên Δt = ΔT = 27 K; T<sub>1</sub> = 300 K, T<sub>2</sub> = 327 K, tỉ số chỉ khoảng 1,09."}, {"type": "mc", "part": 1, "stem": "Một học sinh tự chế nhiệt kế: đánh dấu vạch 0 °C khi nhúng vào nước đá đang tan và vạch 100 °C khi nhúng vào nước đang sôi (như hình, thực hiện trên đỉnh núi cao, nơi áp suất khí quyển thấp hơn áp suất chuẩn), rồi chia đều khoảng giữa hai vạch AC8QoAEAAAAvEKABAAAALxCgAQAAAC8QoAEAAAAvEKABAAAALxCgAQAAAC8QoAEAAAAvEKABAAAALxCgAQAAAC/8fwNcN5zBfHOtAAAAAElFTkSuQmCC", "opts": ["c<sub>X</sub> &lt; c<sub>Y</sub>, vì trong cùng thời gian nhận nhiệt lượng như nhau nhưng X tăng nhiệt độ nhiều hơn.", "c<sub>X</sub> &gt; c<sub>Y</sub>, vì X nhận nhiệt nhanh hơn.", "c<sub>X</sub> = c<sub>Y</sub>, vì hai bếp giống hệt nhau.", "Chưa thể kết luận, vì chưa biết nhiệt độ ban đầu cụ thể của hai chất lỏng."], "correct": 0, "exp": "Độ dốc Δt/Δτ = P<sub>ích</sub>/(m.c); cùng P<sub>ích</sub> và m thì đường dốc hơn (X) ứng với c nhỏ hơn, tức c<sub>X</sub> &lt; c<sub>Y</sub>."}, {"type": "mc", "part": 1, "stem": "Vật A có nhiệt dung (tích m.c) rất lớn ở 20 °C tiếp xúc nhiệt với vật B có nhiệt dung rất nhỏ ở 90 °C; hệ cô lập. Nhận định nào sau đây về trạng thái cuối của hệ là đúng?", "img": null, "opts": ["Nhiệt độ cân bằng là 55 °C (trung bình cộng), vì nhiệt lượng tỏa ra bằng nhiệt lượng thu vào.", "Nhiệt độ cân bằng rất gần 20 °C, vì vật B chỉ cần tỏa nhiệt lượng nhỏ để hạ nhiệt độ, còn nhiệt lượng ấy chỉ làm vật A nóng lên rất ít.", "Nhiệt độ cân bằng rất gần 90 °C, vì vật có nhiệt độ cao hơn quyết định nhiệt độ cuối của hệ.", "Hệ không đạt được cân bằng nhiệt, vì nhiệt dung của hai vật chênh lệch quá lớn."], "correct": 1, "exp": "Từ C<sub>A</sub>(t − 20) = C<sub>B</sub>(90 − t) với C<sub>A</sub> rất lớn hơn C<sub>B</sub> suy ra t xấp xỉ 20 °C; nhiệt độ cuối gần nhiệt độ của vật có nhiệt dung lớn hơn."}, {"type": "mc", "part": 1, "stem": "Đun liên tục khối nước đá ở −10 °C bằng nguồn có công suất không đổi, hao phí không đáng kể. Gọi T<sub>1</sub> là thời gian đá nóng lên từ −10 °C đến 0 °C và T<sub>2</sub> là thời gian đá tan hoàn toàn ở 0 °C. Nhận định nào sau đây đúng?", "img": null, "opts": ["T<sub>1</sub> xấp xỉ T<sub>2</sub>, vì nguồn có công suất không đổi nên thời gian hai giai đoạn như nhau.", "T<sub>1</sub> lớn hơn T<sub>2</sub>, vì ở giai đoạn đầu nhiệt độ thay đổi còn giai đoạn sau nhiệt độ không đổi.", "T<sub>2</sub> lớn hơn T<sub>1</sub> nhiều lần, vì nhiệt lượng cần để phá vỡ cấu trúc tinh thể (nhiệt nóng chảy) lớn hơn nhiều so với nhiệt lượng làm đá nóng thêm 10 °C.", "T<sub>2</sub> bằng 0, vì nhiệt độ không đổi nên nguồn không cung cấp nhiệt cho đá."], "correct": 2, "exp": "Với 1 kg đá: c.Δt = 2100 × 10 = 2,1.10<sup>4</sup> J, còn λ = 3,34.10<sup>5</sup> J nên T<sub>2</sub>/T<sub>1</sub> khoảng 16."}, {"type": "mc", "part": 1, "stem": "Vừa lên khỏi hồ bơi, người ta thấy lạnh hơn hẳn, nhất là khi đứng ở nơi có gió, dù nhiệt độ không khí cao hơn nhiệt độ nước hồ. Giải thích nào sau đây phù hợp nhất?", "img": null, "opts": ["Lớp nước trên da bay hơi: các phân tử có động năng lớn thoát khỏi mặt thoáng, động năng trung bình của phần nước còn lại giảm nên nó thu nhiệt từ cơ thể; gió làm tăng tốc độ bay hơi.", "Hơi nước trong không khí ngưng tụ trên da, quá trình ngưng tụ thu nhiệt từ cơ thể nên ta thấy lạnh.", "Gió làm nhiệt độ không khí giảm xuống thấp hơn nhiệt độ nước hồ.", "Lớp nước trên da sôi ở nhiệt độ thấp và thu nhiệt hóa hơi từ cơ thể."], "correct": 0, "exp": "Bay hơi xảy ra ở mọi nhiệt độ và thu nhiệt (ngưng tụ thì tỏa nhiệt); gió mang hơi nước đi nên bay hơi nhanh hơn."}, {"type": "mc", "part": 1, "stem": "Nồi áp suất làm chín thức ăn nhanh hơn nồi thường chủ yếu vì", "img": null, "opts": ["thành nồi dày hơn nên nước nhận nhiệt từ bếp nhanh hơn.", "nước trong nồi áp suất có nhiệt dung riêng nhỏ hơn nên nóng lên nhanh hơn.", "áp suất cao làm nước sôi ở nhiệt độ thấp hơn nên nước sôi sớm hơn.", "áp suất trên mặt nước tăng làm nhiệt độ sôi của nước cao hơn 100 °C nên thức ăn được nấu ở nhiệt độ cao hơn."], "correct": 3, "exp": "Nhiệt độ sôi tăng theo áp suất; nước sôi ở nhiệt độ cao hơn nên thức ăn chín nhanh hơn."}, {"type": "mc", "part": 1, "stem": "Hình bên mô tả thí nghiệm đo nhiệt hóa hơi riêng của nước: ấm điện đặt trên cân, nước đang sôi, nắp ấm mở. Học sinh tính L = P.t/Δm, với P là công suất ghi trên ấm, Δm là độ giảm số chỉ của cân trong thời gian t. Nguyên nhâ nh cũng thu nhiệt từ nước ấm.", "bằng giá trị thực, vì nước dính cũng ở 0 °C giống như đá.", "không xác định được, vì không biết lượng nước dính.", "nhỏ hơn, vì nhiệt lượng làm tan thực tế chỉ ứng với phần đá thật nhưng lại bị chia cho khối lượng lớn hơn."], "correct": 3, "exp": "Gọi m' là khối lượng đá thật, m là khối lượng đo được (m &gt; m'): nhiệt tỏa ra = m'.λ + m.c.t<sub>cb</sub>, học sinh tính λ' = m'.λ/m &lt; λ."}, {"type": "mc", "part": 1, "stem": "Ban ngày ở vùng ven biển, gió thường thổi từ biển vào đất liền. Nguyên nhân chủ yếu của hiện tượng này là", "img": null, "opts": ["nước biển có nhiệt dung riêng lớn hơn đất nên nóng lên chậm hơn; không khí trên đất nóng lên nhiều hơn, nhẹ đi và bay lên, không khí mát từ biển tràn vào thay chỗ.", "nước biển có nhiệt dung riêng nhỏ hơn đất nên nóng lên nhanh hơn; không khí nóng trên biển bị hút vào đất liền.", "đất có nhiệt dung riêng lớn hơn nước biển nên ban ngày nóng lên chậm hơn; không khí lạnh từ đất tràn ra biển.", "nước biển bay hơi mạnh làm áp suất không khí trên biển tăng lên, đẩy không khí vào đất liền."], "correct": 0, "exp": "Nước có nhiệt dung riêng lớn nên nóng lên chậm hơn đất khi nhận cùng nhiệt lượng; chênh lệch nhiệt độ tạo đối lưu không khí."}, {"type": "mc", "part": 1, "stem": "Phát biểu nào sau đây về nhiệt lượng là đúng?", "img": null, "opts": ["Vật có nhiệt độ càng cao thì chứa nhiệt lượng càng lớn.", "Nhiệt lượng là phần nội năng mà vật nhận thêm hoặc mất bớt trong quá trình truyền nhiệt; nó đặc trưng cho quá trình truyền nhiệt chứ không phải là phần năng lượng “chứa sẵn” trong vật.", "Nhiệt lượng của vật bằng tổng động năng chuyển động nhiệt của các phân tử cấu tạo nên vật.", "Khi hai vật đã cân bằng nhiệt thì nhiệt lượng chứa trong hai vật bằng nhau."], "correct": 1, "exp": "Nhiệt lượng là số đo độ biến thiên nội năng trong truyền nhiệt, không phải là hàm trạng thái; vật không “chứa” nhiệt lượng."}, {"type": "mc", "part": 1, "stem": "Nước trong nồi đang sôi sùng sục ở áp suất khí quyển. Người ta vặn lửa to hơn gấp đôi. Nhận định nào sau đây đúng?", "img": null, "opts": ["Nhiệt độ nước tiếp tục tăng vì nước nhận thêm nhiệt lượng.", "Nhiệt độ nước không đổi (vẫn khoảng 100 °C); nhiệt lượng cung cấp thêm làm nước hóa hơi nhanh hơn nên nước cạn nhanh hơn.", "Nhiệt độ nước giảm vì nước hóa hơi nhanh hơn nên lấy đi nhiều nhiệt hơn.", "Nhiệt độ nước không đổi và lượng nước hóa hơi trong mỗi giây cũng không đổi vì nước chỉ sôi với một tốc độ xác định."], "correct": 1, "exp": "Khi sôi, nhiệt độ được giữ bằng nhiệt độ sôi (phụ thuộc áp suất); nhiệt cung cấp dùng để hóa hơi nên tốc độ hóa hơi tỉ lệ với công suất nhiệt."}, {"type": "tf", "part": 2, "stem": "Thả một giọt mực vào hai cốc nước giống hệt nhau (cùng khối lượng nước), cốc 1 nước lạnh, cốc 2 nước nóng; đặt yên, không khuấy. Hình bên chụp hai cốc sau cùng một khoảng thời gian: mực lan ra trong cả hai cốc, ở cốc nước nóng mực lan nhanh hơn rõ rệt.", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA8gAAAHOCAYAAABElCA2AAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAh1QAAIdUBBJy0nQAAiaBJREFUeJzs3XmcrFddJ/7POc9aW+/39s29SQhJWJWwCAYGExB0Bhxl0wGUkUVQEcfRQRiR4cei6AsIizAgCAhoWBxRgSDMKBoQSGQJ+5J9Icndb2+1Pts55/fHU1Xd1bV0VXdVV1f35/16XcLtruV5qvt21+f5fs/3CGOMAREREREREdEBJ8d9AERERERERER7AQMyERERERERERiQiYiIiIiIiAAwIBMREREREREBYEAmIiIiIiIiAsCATERERERERASAAZmIiIiIiIgIAAMyEREREREREQAGZCIiIiIiIiIADMhEREREREREABiQiYiIiIiIiAAwIBMREREREREBYEAmIiIiIiIiAsCATERERERERASAAZmIiIiIiIgIAAMyEREREREREQAGZCIiIiIiIiIADMhEREREREREABiQiYiIiIiIiAAwIBMREREREREBYEAmIiIiIiIiAsCATERERERERASAAZmIiIiIiIgIAAMyEREREREREQAGZCIiIiIiIiIADMhEREREREREABiQiYiIiIiIiAAwIBMREREREREBYEAmIiIiIiIiAsCATERERERERASAAZmIiIiIiIgIAAMyEREREREREQAGZCIiIiIiIiIADMhEREREREREABiQiYiIiIiIiAAwIBMREREREREBYEAmIiIiIiIiAsCATERERERERASAAZmIiIiIiIgIAAMyEREREREREQAGZCIiIiIiIiIADMhEREREREREABiQiYiIiIiIiAAwIBMREREREREBYEAmIiIiIiIiAsCATERERERERASAAZmIiIiIiIgIAAMyEREREREREQAGZCIiIiIiIiIADMhEREREREREABiQiYiIiIiIiAAwIBMRE ai. Hao phí tích lũy theo thời gian; nên dùng công suất đủ lớn, đun trong thời gian ngắn hơn và bọc cách nhiệt tốt."}]}, {"type": "tf", "part": 2, "stem": "Đun nóng liên tục một khối nước đá ở nhiệt độ dưới 0 °C trong ấm hở, dưới áp suất khí quyển, bằng nguồn có công suất không đổi (hao phí nhỏ, có thể bỏ qua). Đồ thị nhiệt độ theo thời gian (hình bên) gồm bốn đoạn: (1) nhiệt độ tăng đến 0 °C; (2) nằm ngang ở 0 °C; (3) nhiệt độ tăng đến 100 °C; (4) nằm ngang ở 100 °C.", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA0QAAAImCAYAAABzUkrLAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAh1QAAIdUBBJy0nQAAXNNJREFUeJzt3Xd0VGX+x/HPpPdGQgu9V+klQUAUFRsqKGBBEQtVxVWwLth1sbAqVUUUFgVkVxE7IAibBCnSkd4JJYSE9Drz+4MfWULuQOpMMvf9Oocj83xv+U6Oh8ln7r3PY7HZbDYBAAAAgAm5ObsBAAAAAHAWAhEAAAAA0yIQAQAAADAtAhEAAAAA0yIQAQAAADAtAhEAAAAA0yIQAQAAADAtAhEAAAAA0yIQAQAAADAtAhEAAAAA0yIQAQAAADAtAhEAAAAA0yIQAQAAADAtAhEAAAAA0yIQAQAAADAtAhEAAAAA0yIQAQAAADAtAhEAAAAA0yIQAQAAADAtAhEAAAAA0yIQAQAAADAtAhEAAAAA0yIQAQAAADAtAhEAAAAA0yIQAQAAADAtAhEAAAAA0yIQAQAAADAtAhEAAAAA0yIQAQAAADAtAhEAAAAA0/JwdgPApVJTU7V9+3ZJUps2bRQYGOjkjgAAAOCquEKESmf79u2Kjo5WdHR0QTACAAAAKgKBCAAAAIBpEYgAAAAAmBaBCAAAAIBpEYgAAAAAmBaBCAAAAIBpEYgAAAAAmBaBCAAAAIBpEYgAAAAAmBaBCAAAAIBpEYgAAAAAmBaBCAAAAIBpEYgAAAAAmBaBCAAAAIBpEYgAAAAAmBaBCAAAAIBpEYgAAAAAmBaBCAAAAIBpEYgAAAAAmBaBCAAAAIBpEYgAAAAAmBaBCAAAAIBpEYgAAAAAmBaBCAAAAIBpEYgAAAAAmBaBCAAAAIBpEYgAAAAAmBaBCAAAAIBpEYgAAAAAmBaBCAAAAIBpEYgAAAAAmBaBCAAAAIBpEYgAAAAAmBaBCAAAAIBpEYgAAAAAmBaBCAAAAIBpEYgAAAAAmBaBCAAAAIBpEYgAAAAAmBaBCAAAAIBpEYgAAAAAmBaBCAAAAIBpEYgqqYyMDP300096/fXXNWDAANWvX18Wi0UWi0XvvvtusY4RExOju+66S7Vq1ZK3t7fq1q2rBx98UDt27Ljivnl5efroo4/UtWtXBQcHKyAgQO3atdMbb7yhzMzMsr49AAAAoFLwcHYDMLZu3TrdfPPNpd5/ypQpeuaZZ2S1WmWxWBQUFKRjx45p7ty5WrhwoebPn6+BAwca7puenq4bb7xRMTExkiRvb2+5u7tr69at2rp1q+bPn6/ff/9dERERpe4PAAAAqAy4QlSJhYaG6rrrrtP48eP11VdfqWbNmsXab8WKFXr66adltVo1YsQIJSQkKDk5WUePHtUdd9yh7Oxs3X///dqzZ4/h/qNHj1ZMTIyCgoK0cOFCZWRkKD09Xb/++qtq1aqlv/7  if(q.type=='mc'){const c=it.ord.indexOf(q.correct);it.ord.forEach((o,i)=>{let k='opt';if(done)k+=i==c?' ok':i==it.ans?' bad':'';else if(it.ans===i)k+=' sel';
  h+=`<button class="${k}" data-i="${i}" ${done?'disabled':''}><b>${L[i]}.</b><span>${q.opts[o]}${done&&i==c?' ✓':''}</span></button>`});if(done)h+=`<div class="exp"><b>Gợi ý:</b> ${q.exp}</div>`}
 if(q.type=='tf'){it.ord.forEach((o,i)=>{const x=q.items[o],a=it.ans[i];const b=v=>{let k=v===a?'sel':'';if(done){k=v===x.v?'ok':(v===a?'bad':'')}return k};
  h+=`<div class="row"><div>${l2[i]}) ${x.t}</div><div class="yn"><button class="${b(true)}" data-i="${i}" data-v="1" ${done?'disabled':''}>Đúng</button><button class="${b(false)}" data-i="${i}" data-v="0" ${done?'disabled':''}>Sai</button></div>${done?`<div class="exp">${x.e}</div>`:''}</div>`})}
 if(q.type=='sa'){h+=`<input class="num" id="in" inputmode="decimal" placeholder="Nhập đáp án (số)" ${done?'disabled':''}>`;if(done){const ok=score(it)>0;h+=`<div class="exp"><b>${ok?'Chính xác.':'Chưa đúng.'}</b> Đáp án: <b>${q.show}</b> ${q.unit}<br>${q.exp}</div>`}}
 h+=`</div><div class="nav"><button class="btn" id="pv" ${cur==0?'disabled':''}>← Câu trước</button><span class="sp"></span>`;
 if(done)h+=`<button class="btn" id="res">Về kết quả</button>`;else if(cur==Q.length-1)h+=`<button class="btn p" id="sub">Nộp bài</button>`;else h+=`<button class="btn" id="sub2">Nộp bài</button>`;
 h+=`<button class="btn p" id="nx" ${cur==Q.length-1?'disabled':''}>Câu sau →</button></div><div class="chips" id="ch"></div>`;
 if(ask){const n=Q.filter(x=>!answered(x)).length;h+=`<div class="ov"><div class="card"><p><b>Nộp bài?</b></p><p>${n?`Còn <b>${n}</b> câu chưa trả lời đầy đủ. Sau khi nộp sẽ không sửa được.`:'Bạn đã trả lời tất cả các câu. Sau khi nộp sẽ không sửa được.'}</p><div class="nav"><button class="btn" id="no">Làm tiếp</button><button class="btn p" id="yes">Nộp bài</button></div></div></div>`}
 A.innerHTML=h;chips();
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(!done){it.ans=+b.dataset.i;render()}});
 document.querySelectorAll('.yn button').forEach(b=>b.onclick=()=>{if(!done){it.ans[+b.dataset.i]=b.dataset.v=='1';render()}});
 const inp=$('#in');if(inp){inp.value=it.ans;inp.oninput=()=>{it.ans=inp.value;chips()}}
 $('#pv').onclick=()=>{cur--;render();window.scrollTo(0,0)};$('#nx').onclick=()=>{cur++;render();window.scrollTo(0,0)};
 const r=$('#res');if(r)r.onclick=()=>{screen='result';render()};
 [$('#sub'),$('#sub2')].forEach(b=>{if(b)b.onclick=()=>{ask=true;render()}});
 if(ask){$('#no').onclick=()=>{ask=false;render()};$('#yes').onclick=()=>{ask=false;done=true;screen='result';render();window.scrollTo(0,0)}}}
function chips(){const c=$('#ch');if(!c)return;c.innerHTML='';Q.forEach((it,i)=>{const b=document.createElement('button');b.textContent=i+1;let k='';
 if(done){const s=score(it);k=s==mx(it)?'ok':s>0?'part':'bad'}else if(answered(it))k='ans';if(screen=='quiz'&&i==cur)k+=' cur';b.className=k;
 b.onclick=()=>{cur=i;screen='quiz';render();window.scrollTo(0,0)};c.appendChild(b)})}
render();
</script></body></html>
